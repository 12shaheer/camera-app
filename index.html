<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>FPS Camera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; height: 100dvh; touch-action: none; user-select: none; }
    video { width: 100%; height: 100dvh; object-fit: cover; position: fixed; top: 0; left: 0; }
    #gun-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    #ui-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 20;
      pointer-events: none;
    }
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 55px; height: 55px;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.38);
      border-radius: 1px;
    }
    #crosshair::before {
      width: 2px; height: 20px;
      top: 0; left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 35px 0 rgba(255,255,255,0.38);
    }
    #crosshair::after {
      width: 20px; height: 2px;
      top: 50%; left: 0;
      transform: translateY(-50%);
      box-shadow: 35px 0 0 rgba(255,255,255,0.38);
    }
    #crosshair-dot {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 3px; height: 3px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
    }
    #hud {
      position: absolute;
      bottom: 30px;
      right: 20px;
      color: #fff;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #ammo-display {
      font-size: 36px;
      font-weight: bold;
      text-align: right;
    }
    #ammo-display .current { color: #fff; }
    #ammo-display .separator { color: rgba(255,255,255,0.5); }
    #ammo-display .max { color: rgba(255,255,255,0.5); font-size: 22px; }
    #ammo-bar {
      width: 120px;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      margin-top: 6px;
      margin-left: auto;
      overflow: hidden;
    }
    #ammo-bar-fill {
      height: 100%;
      background: #00ff88;
      border-radius: 2px;
      transition: width 0.1s, background 0.3s;
    }
    #overheat-warning {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff4444;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      background: rgba(0,0,0,0.5);
      padding: 6px 14px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.3s;
      letter-spacing: 1px;
    }
    #overheat-warning.visible { opacity: 1; }
    #muzzle-flash {
      position: absolute;
      top: 38%;
      left: 52%;
      transform: translate(-50%, -50%);
      width: 60px; height: 60px;
      background: radial-gradient(circle, rgba(100,255,50,0.95) 0%, rgba(0,255,100,0.6) 30%, rgba(0,180,80,0.3) 60%, transparent 75%);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      filter: blur(1px);
    }
    #shoot-area {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 15;
      pointer-events: auto;
    }
    #reload-btn {
      position: fixed;
      bottom: 30px;
      left: 20px;
      z-index: 25;
      pointer-events: auto;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-family: sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
    }
    #reload-btn:active { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline></video>
  <canvas id="gun-canvas"></canvas>

  <div id="shoot-area"></div>

  <div id="ui-layer">
    <div id="crosshair"><div id="crosshair-dot"></div></div>
    <div id="muzzle-flash"></div>
    <div id="hud">
      <div id="ammo-display">
        <span class="current" id="ammo-current">16</span><span class="separator"> / </span><span class="max" id="ammo-max">16</span>
      </div>
      <div id="ammo-bar"><div id="ammo-bar-fill" style="width:100%"></div></div>
    </div>
    <div id="overheat-warning">OVERHEATED</div>
  </div>

  <button id="reload-btn">Reload</button>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- Camera Feed ---
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(s => document.getElementById('v').srcObject = s)
      .catch(e => document.body.innerText = 'Camera error: ' + e.message);

    // --- Three.js Setup ---
    const canvas = document.getElementById('gun-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 0, 0);

    // Lighting matching Unity scene
    const mainLight = new THREE.DirectionalLight(0xffffff, 3);
    mainLight.position.set(2, 3, 4);
    scene.add(mainLight);
    const fillLight = new THREE.DirectionalLight(0x6688aa, 1);
    fillLight.position.set(-2, 0, -1);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0x00ff88, 0.5);
    rimLight.position.set(0, 1, -3);
    scene.add(rimLight);
    scene.add(new THREE.AmbientLight(0x404040, 2));

    // --- Weapon Parameters (exact from Unity Weapon_Blaster.prefab) ---
    const weapon = {
      maxAmmo: 16,
      currentAmmo: 16,
      delayBetweenShots: 0.1,       // from prefab
      recoilForce: 1.0,             // from prefab RecoilForce: 1
      ammoReloadRate: 16,           // from prefab
      ammoReloadDelay: 1.0,         // from prefab
      automaticReload: true,        // from prefab
      lastTimeShot: -Infinity,
      isCooling: false,
      shootType: 'automatic',       // ShootType: 1 = Automatic
    };

    // --- Weapon Bob (from PlayerWeaponsManager exact values) ---
    const bob = {
      frequency: 10,                // BobFrequency
      sharpness: 10,                // BobSharpness
      defaultAmount: 0.05,          // DefaultBobAmount
      aimingAmount: 0.02,           // AimingBobAmount
      factor: 0,
      position: new THREE.Vector3(),
    };

    // --- Recoil (from PlayerWeaponsManager exact values) ---
    const recoil = {
      sharpness: 50,                // RecoilSharpness
      maxDistance: 0.5,             // MaxRecoilDistance
      restitutionSharpness: 10,     // RecoilRestitutionSharpness
      accumulated: new THREE.Vector3(),
      position: new THREE.Vector3(),
    };

    // --- Weapon Positioning ---
    const weaponAnim = {
      defaultPos: new THREE.Vector3(5, -3, -8),
      downPos: new THREE.Vector3(5, -10, -8),
      currentPos: new THREE.Vector3(5, -3, -8),
      defaultRot: new THREE.Euler(0, -Math.PI / 10, 0),
    };

    // --- Load Unity Weapon GLB + Apply PBR Textures ---
    let gunModel = null;
    let fuelCells = [];   // Container meshes = fuel cells
    let weaponBody = null;
    const textureLoader = new THREE.TextureLoader();
    const gltfLoader = new GLTFLoader();

    // Load textures
    const albedoMap = textureLoader.load('textures/Blaster_Albedo.png');
    const normalMap = textureLoader.load('textures/Blaster_Normal.png');
    const metallicMap = textureLoader.load('textures/Blaster_MetallicSmooth.png');
    const emissiveMap = textureLoader.load('textures/Blaster_Emissive.png');
    const aoMap = textureLoader.load('textures/Blaster_AO.png');
    albedoMap.colorSpace = THREE.SRGBColorSpace;
    emissiveMap.colorSpace = THREE.SRGBColorSpace;
    [albedoMap, normalMap, metallicMap, emissiveMap, aoMap].forEach(t => {
      t.flipY = false;
    });

    // Emission color from Unity material: (r:0, g:2.64, b:0) = bright green
    const emissionColor = new THREE.Color(0, 2.64, 0);

    gltfLoader.load('weapon_primary.glb', (gltf) => {
      gunModel = gltf.scene;
      gunModel.scale.setScalar(1.6);
      gunModel.position.copy(weaponAnim.defaultPos);
      gunModel.rotation.copy(weaponAnim.defaultRot);

      gunModel.traverse((child) => {
        if (child.isMesh) {
          // Apply proper PBR material matching Unity's WeaponBlaster.mat
          child.material = new THREE.MeshStandardMaterial({
            map: albedoMap,
            normalMap: normalMap,
            metalnessMap: metallicMap,
            metalness: 0.262,         // from Unity _Metallic: 0.262
            roughness: 1.0,           // _Smoothness: 0, so roughness = 1
            emissiveMap: emissiveMap,
            emissive: emissionColor,
            emissiveIntensity: 1.0,
            aoMap: aoMap,
            aoMapIntensity: 1.0,
          });

          // Track fuel cell containers for reload animation
          if (child.name.includes('Container')) {
            fuelCells.push({
              mesh: child,
              originalY: child.position.y,
            });
          }
          if (child.name === 'Primary_Weapon') {
            weaponBody = child;
          }
        }
      });

      scene.add(gunModel);
    });

    // --- Muzzle Flash ---
    const muzzleFlashEl = document.getElementById('muzzle-flash');
    function showMuzzleFlash() {
      muzzleFlashEl.style.opacity = '1';
      muzzleFlashEl.style.transform = `translate(-50%, -50%) scale(${0.7 + Math.random() * 0.6}) rotate(${Math.random() * 360}deg)`;
      setTimeout(() => { muzzleFlashEl.style.opacity = '0'; }, 50);
    }

    // --- HUD ---
    const ammoCurrentEl = document.getElementById('ammo-current');
    const ammoMaxEl = document.getElementById('ammo-max');
    const ammoBarFill = document.getElementById('ammo-bar-fill');
    const overheatEl = document.getElementById('overheat-warning');

    function updateHUD() {
      const ratio = weapon.currentAmmo / weapon.maxAmmo;
      ammoCurrentEl.textContent = Math.ceil(weapon.currentAmmo);
      ammoMaxEl.textContent = weapon.maxAmmo;
      ammoBarFill.style.width = (ratio * 100) + '%';

      // Overheat gradient from Unity: green -> orange -> red
      if (ratio > 0.5) {
        ammoBarFill.style.background = '#00ff88';
        ammoCurrentEl.style.color = '#fff';
      } else if (ratio > 0.2) {
        ammoBarFill.style.background = '#ffaa00';
        ammoCurrentEl.style.color = '#ffaa00';
      } else {
        ammoBarFill.style.background = '#ff3300';
        ammoCurrentEl.style.color = '#ff3300';
      }

      if (weapon.currentAmmo <= 0) {
        overheatEl.classList.add('visible');
      } else {
        overheatEl.classList.remove('visible');
      }
    }

    // --- Shoot (from Unity WeaponController.TryShoot + HandleShoot) ---
    let now = performance.now() / 1000;

    function tryShoot() {
      if (weapon.currentAmmo < 1) return false;
      if (now - weapon.lastTimeShot < weapon.delayBetweenShots) return false;

      weapon.currentAmmo -= 1;
      weapon.lastTimeShot = now;

      // Recoil: accumulate backward force (from Unity: m_AccumulatedRecoil += Vector3.back * RecoilForce)
      recoil.accumulated.z -= weapon.recoilForce * 0.03;
      recoil.accumulated.z = Math.max(recoil.accumulated.z, -recoil.maxDistance * 0.06);

      // Weapon kick rotation
      recoil.accumulated.x += weapon.recoilForce * 0.015;

      showMuzzleFlash();
      updateHUD();

      if (navigator.vibrate) navigator.vibrate(25);
      return true;
    }

    // --- Automatic Reload (from Unity WeaponController.UpdateAmmo) ---
    // "reloads weapon over time" after AmmoReloadDelay
    function updateAmmo(dt) {
      if (weapon.automaticReload &&
          weapon.lastTimeShot + weapon.ammoReloadDelay < now &&
          weapon.currentAmmo < weapon.maxAmmo) {
        weapon.currentAmmo += weapon.ammoReloadRate * dt;
        weapon.currentAmmo = Math.min(weapon.currentAmmo, weapon.maxAmmo);
        weapon.isCooling = true;
        updateHUD();
      } else {
        weapon.isCooling = false;
      }
    }

    // --- Fuel Cell Animation (from Unity WeaponFuelCellHandler.Update) ---
    // Cells retract based on ammo ratio - exact Unity logic:
    // value = InverseLerp(i/length, (i+1)/length, ammoRatio)
    // position = Lerp(usedPos, unusedPos, value)
    const fuelCellUsedOffset = 0;      // FuelCellUsedPosition.y = 0
    const fuelCellUnusedOffset = 0.1;  // FuelCellUnusedPosition.y = 0.1 (from prefab)

    function updateFuelCells() {
      if (fuelCells.length === 0) return;
      const ammoRatio = weapon.currentAmmo / weapon.maxAmmo;
      const length = fuelCells.length;

      for (let i = 0; i < length; i++) {
        const lim1 = i / length;
        const lim2 = (i + 1) / length;
        let value = (ammoRatio - lim1) / (lim2 - lim1);
        value = Math.max(0, Math.min(1, value));

        const offset = fuelCellUsedOffset + (fuelCellUnusedOffset - fuelCellUsedOffset) * (1 - value);
        fuelCells[i].mesh.position.y = fuelCells[i].originalY + offset * 30;
      }
    }

    // --- Weapon Bob (exact from Unity UpdateWeaponBob) ---
    function updateWeaponBob(dt) {
      const moveFactor = weapon.isCooling ? 0.15 : 0.25;
      bob.factor += (moveFactor - bob.factor) * Math.min(bob.sharpness * dt, 1);

      const bobAmount = bob.defaultAmount;
      const hBob = Math.sin(now * bob.frequency) * bobAmount * bob.factor;
      const vBob = ((Math.sin(now * bob.frequency * 2) * 0.5) + 0.5) * bobAmount * bob.factor;

      bob.position.x = hBob;
      bob.position.y = Math.abs(vBob);
    }

    // --- Recoil (exact from Unity UpdateWeaponRecoil) ---
    const zeroVec = new THREE.Vector3(0, 0, 0);
    function updateWeaponRecoil(dt) {
      if (recoil.position.z >= recoil.accumulated.z * 0.99) {
        recoil.position.lerp(recoil.accumulated, Math.min(recoil.sharpness * dt, 1));
      } else {
        recoil.position.lerp(zeroVec, Math.min(recoil.restitutionSharpness * dt, 1));
        recoil.accumulated.copy(recoil.position);
      }
      // Also decay the rotation recoil
      recoil.accumulated.x *= (1 - Math.min(recoil.restitutionSharpness * dt, 1));
    }

    // --- Overheat Emission (from Unity ChargedWeaponEffectsHandler overheat gradient) ---
    // Gradient: key0 green(0.314, 3.48, 0) -> key1 orange(5.21, 1.56, 0) -> key2 red(8, 0, 0)
    function updateOverheatEmission() {
      if (!weaponBody) return;
      const ratio = weapon.currentAmmo / weapon.maxAmmo;
      const heatRatio = 1 - ratio;

      let r, g, b;
      if (heatRatio < 0.5) {
        const t = heatRatio / 0.5;
        r = THREE.MathUtils.lerp(0, 0.8, t);
        g = THREE.MathUtils.lerp(2.64, 1.5, t);
        b = 0;
      } else {
        const t = (heatRatio - 0.5) / 0.5;
        r = THREE.MathUtils.lerp(0.8, 2.0, t);
        g = THREE.MathUtils.lerp(1.5, 0, t);
        b = 0;
      }

      if (gunModel) {
        gunModel.traverse((child) => {
          if (child.isMesh && child.material.emissive) {
            child.material.emissive.setRGB(r, g, b);
            child.material.emissiveIntensity = 0.5 + heatRatio * 1.5;
          }
        });
      }
    }

    // --- Input Handling ---
    let isFiring = false;
    const shootArea = document.getElementById('shoot-area');

    shootArea.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isFiring = true;
      tryShoot();
    });
    shootArea.addEventListener('pointerup', () => { isFiring = false; });
    shootArea.addEventListener('pointerleave', () => { isFiring = false; });
    shootArea.addEventListener('pointercancel', () => { isFiring = false; });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === 'f') { isFiring = true; tryShoot(); }
    });
    document.addEventListener('keyup', (e) => {
      if (e.code === 'Space' || e.key === 'f') isFiring = false;
    });

    // Manual reload override (force full ammo)
    document.getElementById('reload-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      weapon.currentAmmo = weapon.maxAmmo;
      updateHUD();
      if (navigator.vibrate) navigator.vibrate([40, 30, 40]);
    });

    // --- Animation Loop ---
    let lastTime = performance.now() / 1000;

    function animate() {
      requestAnimationFrame(animate);
      now = performance.now() / 1000;
      const dt = Math.min(now - lastTime, 0.1);
      lastTime = now;

      // Automatic fire (Unity ShootType.Automatic: fires while inputHeld)
      if (isFiring) {
        tryShoot();
      }

      updateAmmo(dt);
      updateFuelCells();
      updateWeaponBob(dt);
      updateWeaponRecoil(dt);
      updateOverheatEmission();

      // Apply final position (from Unity: WeaponParentSocket.localPosition = main + bob + recoil)
      if (gunModel) {
        const targetPos = weaponAnim.defaultPos.clone()
          .add(bob.position)
          .add(new THREE.Vector3(0, 0, recoil.position.z));

        gunModel.position.lerp(targetPos, Math.min(25 * dt, 1));

        // Apply recoil rotation (weapon kicks up when firing)
        const targetRotX = weaponAnim.defaultRot.x - recoil.accumulated.x;
        const targetRotY = weaponAnim.defaultRot.y;
        const targetRotZ = weaponAnim.defaultRot.z;
        gunModel.rotation.x += (targetRotX - gunModel.rotation.x) * Math.min(20 * dt, 1);
        gunModel.rotation.y += (targetRotY - gunModel.rotation.y) * Math.min(20 * dt, 1);
        gunModel.rotation.z += (targetRotZ - gunModel.rotation.z) * Math.min(20 * dt, 1);
      }

      renderer.render(scene, camera);
    }
    animate();

    // --- Resize ---
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    updateHUD();
  </script>
</body>
</html>
